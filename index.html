<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flashcard</title>
  <meta name="description" content="Học từ vựng bằng flashcard, chạy offline.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Flashcard">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Màn hình danh sách -->
  <div id="screen-list" class="screen">
    <header class="topbar">
      <h1 id="deck-title" class="topbar-title">Flashcard</h1>
      <button id="btn-shuffle" class="icon-btn ripple" type="button" aria-label="Xáo trộn" title="Xáo trộn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button id="btn-pull" class="icon-btn ripple" type="button" aria-label="Pull" hidden></button>
      <button id="btn-push" class="icon-btn ripple" type="button" aria-label="Push" hidden></button>
      <button id="btn-menu" class="icon-btn ripple" type="button" aria-label="Menu" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </header>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Bộ thẻ"></nav>

    <main id="list" class="list-wrap"></main>

    <button id="fab" class="fab ripple" type="button" aria-label="Thêm thẻ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    </button>
  </div>


  <!-- Lớp phủ dùng chung -->
  <div id="scrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="dialog-wrap" class="dialog-wrap" hidden></div>
  <div id="snackbar" class="snackbar" role="status" aria-live="polite" hidden></div>
  <div id="ios-banner" class="ios-banner" hidden></div>
  <input id="file-input" type="file" accept="application/json,.json" hidden>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
